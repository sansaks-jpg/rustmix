[workspace]
members = ["crates/engine", "crates/ui-egui", "apps/rustmix"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.27"
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "wgpu", "persistence", "accesskit", "x11", "wayland"] }
egui_dock = { version = "=0.20.1", features = ["serde"] }
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
