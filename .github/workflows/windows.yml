name: Windows native UI
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-ui-v2-complete
          cache-on-failure: false
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Dependency layering and asset inventory
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release on GitHub only
        run: cargo build --release --workspace --locked
      - name: Package Windows executable
        if: ${{ !cancelled() && hashFiles('target/release/rustmix.exe') != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath target/release/rustmix.exe -Destination dist/
          Copy-Item -LiteralPath README.md,ATTRIBUTION.md,LICENSE-MIT -Destination dist/
          ./scripts/collect-notices.ps1
          Get-FileHash -Algorithm SHA256 dist/rustmix.exe | Format-List | Out-File dist/SHA256.txt
          'Experimental build. Check the associated GitHub run for actual test outcomes. Physical display/audio acceptance and complete vMix-class functionality are not qualified.' | Set-Content dist/BUILD-STATUS.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('dist/rustmix.exe') != '' }}
        with:
          name: rustmix-windows-x64
          path: dist/
          if-no-files-found: error
