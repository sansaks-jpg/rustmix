name: Windows native UI
on:
  push:
    branches: [main, 'codex/**', 'arena/**']
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Ensure Cargo.lock exists
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath Cargo.lock)) {
            cargo generate-lockfile
          }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-ui-v2-complete
          cache-on-failure: false
      - name: Formatting
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) {
            cargo fmt --all
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $patch = git diff -- '*.rs' | Out-String
            $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($patch))
            $chunkSize = 3500
            $chunks = [int][Math]::Ceiling($encoded.Length / $chunkSize)
            if ($chunks -gt 10) { throw 'Rustfmt patch exceeds annotation capacity' }
            for ($index = 0; $index -lt $chunks; $index++) {
              $offset = $index * $chunkSize
              $part = $encoded.Substring($offset, [Math]::Min($chunkSize, $encoded.Length - $offset))
              Write-Output "::error title=Rustfmt patch $($index + 1) of $($chunks)::$part"
            }
            exit 1
          }
      - name: Dependency layering and asset inventory
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Check workspace
        run: cargo check --workspace --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Generate MP4 test fixture
        shell: pwsh
        run: ./scripts/ci-video-fixture.ps1
      - name: Run workspace tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:RUNNER_TEMP 'rustmix-test.log'
          cargo test --workspace --all-targets --locked 2>&1 | Tee-Object -FilePath $log
          $testCode = $LASTEXITCODE
          if ($testCode -ne 0) {
            $tail = Get-Content -LiteralPath $log -Tail 120 | Out-String
            if ($tail.Length -gt 5000) { $tail = $tail.Substring($tail.Length - 5000) }
            $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($tail))
            $chunkSize = 3500
            $chunks = [int][Math]::Ceiling($encoded.Length / $chunkSize)
            for ($index = 0; $index -lt $chunks; $index++) {
              $offset = $index * $chunkSize
              $part = $encoded.Substring($offset, [Math]::Min($chunkSize, $encoded.Length - $offset))
              Write-Output "::error title=Test output $($index + 1) of $($chunks)::$part"
            }
            exit $testCode
          }
      - name: Build release on GitHub only
        run: cargo build --release --workspace --locked
      - name: Package Windows executable
        if: ${{ success() && hashFiles('target/release/rustmix.exe') != '' }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -LiteralPath target/release/rustmix.exe -Destination dist/
          Copy-Item -LiteralPath README.md,ATTRIBUTION.md,LICENSE-MIT -Destination dist/
          Copy-Item -LiteralPath docs/core-engine-audit.md -Destination dist/AUDIT.md
          $env:GITHUB_SHA | Set-Content dist/BUILD-COMMIT.txt
          ./scripts/collect-notices.ps1
          Get-FileHash -Algorithm SHA256 dist/rustmix.exe | Format-List | Out-File dist/SHA256.txt
          'Experimental core build. This workflow runs formatting, workspace checks, Clippy and tests before packaging. Physical display/audio and production endurance are not qualified; see AUDIT.md.' | Set-Content dist/BUILD-STATUS.txt
      - uses: actions/upload-artifact@v4
        if: ${{ success() && hashFiles('dist/rustmix.exe') != '' }}
        with:
          name: rustmix-windows-x64
          path: dist/
          if-no-files-found: error
